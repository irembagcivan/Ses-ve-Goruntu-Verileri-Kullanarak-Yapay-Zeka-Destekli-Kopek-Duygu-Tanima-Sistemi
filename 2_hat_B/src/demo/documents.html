<!doctype html><html lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canine · Proje belgeleri</title><style>
*{box-sizing:border-box}body{margin:0;background:#f1f4ee;color:#172c29;font:17px system-ui;line-height:1.6}main{max-width:900px;margin:auto;padding:32px 22px}h1{font-size:36px;line-height:1.2}.card{background:#fff;border:1px solid #d7e1d9;padding:24px;border-radius:18px;margin:24px 0}button,a,input{font:inherit}a{color:#225f48}button{border:0;border-radius:10px;background:#204f3e;color:white;padding:11px 18px;cursor:pointer}button:disabled{opacity:.5}input{display:block;width:100%;margin:18px 0;padding:12px;border:1px dashed #92ad9a;border-radius:10px}ul{list-style:none;padding:0}li{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:18px 0;border-bottom:1px solid #d7e1d9}.actions{display:flex;gap:12px;align-items:center;flex-shrink:0}.remove{color:#8c322a;background:#faeeeb}#status{color:#725325}small{color:#536962}#status:empty{display:none}.name{overflow-wrap:anywhere;min-width:0}@media(max-width:600px){li{align-items:flex-start;flex-direction:column}h1{font-size:29px}}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #3d805f;outline-offset:4px}</style>
<main><nav><a href="/start">Başlangıç</a> · <a href="/evaluation">Yöntem ve sonuçlar</a> · <a href="/presentation">Sunum</a></nav><h1 id="title"></h1><section class="card"><label id="fileLabel" for="file"></label><input id="file" type="file" accept=".pdf,.docx,.pptx,.txt,.md"><small>PDF, Word, PowerPoint veya metin · En fazla 50 MB</small><p><button id="add">Dosya ekle</button></p><p id="status" role="status" aria-live="polite"></p></section><section class="card"><h2>Belgelerim</h2><ul id="list"></ul></section></main><script>
const category='__CATEGORY__',$=id=>document.getElementById(id);let busy=false;
$('title').textContent=category==='report'?'Yöntem ve sonuçlar':'Sunum';
$('fileLabel').textContent=category==='report'?'Raporunu ekle':'Sunumunu ekle';
async function session(){const r=await fetch('/api/session',{cache:'no-store'});if(!r.ok)throw Error('Uygulamayı başlatıp yeniden dene.');return (await r.json()).token}
async function list(){const response=await fetch('/api/documents/'+category,{cache:'no-store'});if(!response.ok)throw Error('Belge listesi açılamadı.');const records=await response.json();$('list').replaceChildren();if(!records.length){$('list').textContent='Henüz belge yok.';return}for(const record of records){const row=document.createElement('li'),name=document.createElement('span'),actions=document.createElement('span'),open=document.createElement('a'),remove=document.createElement('button');name.className='name';name.textContent=record.name;actions.className='actions';open.textContent='Aç / indir';open.href='/api/documents/'+category+'/'+record.id+'/file';open.target='_blank';open.rel='noopener';remove.textContent=record.builtin?'Listeden kaldır':'Sil';remove.className='remove';remove.onclick=async()=>{if(busy)return;busy=true;remove.disabled=true;try{const token=await session(),r=await fetch('/api/documents/'+category+'/'+record.id,{method:'DELETE',headers:{'X-Canine-Token':token}});if(!r.ok)throw Error('Belge silinemedi.');$('status').textContent='Belge kaldırıldı.';await list()}catch(e){$('status').textContent=e.message}finally{busy=false;remove.disabled=false}};actions.append(open,remove);row.append(name,actions);$('list').append(row)}}
$('add').onclick=async()=>{if(busy)return;const file=$('file').files[0];if(!file){$('status').textContent='Önce bir dosya seç.';return}if(file.size>50*1024*1024){$('status').textContent='Dosya 50 MB sınırını aşıyor.';return}busy=true;$('add').disabled=true;$('status').textContent='Dosya ekleniyor…';try{const token=await session(),r=await fetch('/api/documents/'+category+'?name='+encodeURIComponent(file.name),{method:'POST',headers:{'X-Canine-Token':token,'Content-Type':'application/octet-stream'},body:file}),data=await r.json();if(!r.ok)throw Error(data.error||'Dosya eklenemedi.');$('file').value='';await list();$('status').textContent='Dosya eklendi.'}catch(e){$('status').textContent=e.message}finally{busy=false;$('add').disabled=false}};
list().catch(()=>{$('status').textContent='Belgeler açılamadı. Uygulamayı başlatıp sayfayı yenile.'});
</script></html>
